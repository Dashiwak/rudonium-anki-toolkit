name: Build review candidate
on:
  workflow_dispatch:
    inputs:
      check_published_assets:
        description: Compare the selected tag's published release files with the build
        type: boolean
        default: false
  release:
    types: [published]
  push:
    branches: ['work/**', 'fix/**', 'main', 'master']
    tags: ['[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Check the release version across source metadata and the tag
        shell: bash
        env:
          CHECK_PUBLISHED: ${{ inputs.check_published_assets }}
        run: |
          node <<'JS'
          const assert = require("node:assert/strict");
          const manifest = require("./manifest.json");
          const lockfile = require("./package-lock.json");
          assert.match(manifest.version, /^\d+\.\d+\.\d+$/);
          for (const entry of [require("./package.json"), lockfile, lockfile.packages[""]]) {
            assert.equal(entry.version, manifest.version);
          }
          assert.equal(require("./versions.json")[manifest.version], manifest.minAppVersion);
          if (process.env.CHECK_PUBLISHED === "true") assert.equal(process.env.GITHUB_REF_TYPE, "tag", "Choose a release tag for the published asset check");
          if (process.env.GITHUB_REF_TYPE === "tag") assert.equal(process.env.GITHUB_REF_NAME, manifest.version);
          JS
      - name: Run Rudonium regression tests
        run: npm test
      - name: Build from lockfile and compare two clean rebuilds
        shell: pwsh
        run: node Build/prepare-gitflic.cjs - "$env:RUNNER_TEMP/review-candidate"
      - name: Retain verified candidate for review
        uses: actions/upload-artifact@v7
        with:
          name: rudonium-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/review-candidate/notices/
            ${{ runner.temp }}/review-candidate/install/
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install plugin dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify installed Markdown and glob dependencies
        run: npm run test:dependencies
      - name: Install the official lint preset separately from the runtime lockfile
        run: |
          mkdir -p "$RUNNER_TEMP/review-tools"
          npm install --prefix "$RUNNER_TEMP/review-tools" --ignore-scripts --no-audit --no-fund eslint@9.39.1 eslint-plugin-obsidianmd@0.4.2
          cp eslint.config.mjs "$RUNNER_TEMP/review-tools/"
      - name: Lint plugin sources, manifest and license
        run: |
          node "$RUNNER_TEMP/review-tools/node_modules/eslint/bin/eslint.js" --config "$RUNNER_TEMP/review-tools/eslint.config.mjs" main.ts 'src/**/*.ts' wdio.conf.ts manifest.json LICENSE --max-warnings 0 --format json --output-file "$RUNNER_TEMP/obsidian-eslint.json"
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: obsidian-eslint-${{ github.sha }}
          path: ${{ runner.temp }}/obsidian-eslint.json
          if-no-files-found: error


  attest:
    if: github.ref_type == 'tag'
    needs: [verify, lint]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: rudonium-candidate-${{ github.sha }}
          path: candidate
      - name: Download the published assets for comparison
        if: github.event_name == 'release' || inputs.check_published_assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir published \
            --pattern main.js --pattern manifest.json --pattern styles.css
      - name: Compare downloaded assets with the verified build
        working-directory: candidate
        env:
          CHECK_PUBLISHED: ${{ github.event_name == 'release' || inputs.check_published_assets }}
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const { readFileSync } = require('node:fs');
          const { createHash } = require('node:crypto');
          const { release, artifacts } = require('./notices/PROVENANCE.json');
          const files = ['main.js', 'manifest.json', 'styles.css'];
          assert.equal(release.version, process.env.GITHUB_REF_NAME);
          assert.deepEqual(artifacts.map(item => item.path).sort(), files);
          for (const file of files) {
            const digest = createHash('sha256').update(readFileSync('install/' + file)).digest('hex');
            assert.equal(digest, artifacts.find(item => item.path === file).sha256);
            if (process.env.CHECK_PUBLISHED === 'true') {
              assert.deepEqual(readFileSync('../published/' + file), readFileSync('install/' + file),
                'Published release asset differs from the verified build: ' + file);
            }
            console.log(digest + '  ' + file);
          }
          JS
      - name: Attest the verified Obsidian assets
        uses: actions/attest@v4
        with:
          create-storage-record: false
          subject-path: |
            candidate/install/main.js
            candidate/install/manifest.json
            candidate/install/styles.css
      - name: Verify each release file and record its digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in main.js manifest.json styles.css; do
            file="candidate/install/$asset"
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/review-candidate.yml"
            (cd candidate/install && sha256sum "$asset") >> "$RUNNER_TEMP/attested-files.txt"
          done
          {
            echo "### Verified files for $GITHUB_REF_NAME"
            echo 'Download the candidate artifact from this run and attach the three files in its install folder to the release.'
            echo '```'
            cat "$RUNNER_TEMP/attested-files.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
